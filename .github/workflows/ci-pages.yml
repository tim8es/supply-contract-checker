name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Evaluate frozen synthetic holdout (non-gating quality report)
        run: |
          mkdir -p artifacts
          node scripts/benchmark.mjs --output artifacts/benchmark.json --markdown artifacts/benchmark.md
          cat artifacts/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export quality benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark
          path: |
            artifacts/benchmark.json
            artifacts/benchmark.md
          retention-days: 14
          if-no-files-found: error
      - name: Browser E2E — filter, citation, upload
        run: node scripts/smoke-browser.mjs
      - name: Browser smoke test — six documents and dynamic table
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 >/tmp/stn-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --user-data-dir="$(mktemp -d)" --virtual-time-budget=6000 \
            --dump-dom 'http://127.0.0.1:5173/?demo=1' > /tmp/stn-dom.html 2>/tmp/stn-browser.log
          grep -Fq 'STN-101' /tmp/stn-dom.html
          grep -Fq 'STN-102' /tmp/stn-dom.html
          grep -Fq 'STN-103' /tmp/stn-dom.html
          grep -Fq 'Готово: 6 документов' /tmp/stn-dom.html
          grep -Fq 'Нет данных' /tmp/stn-dom.html
      - name: Produce UI screenshot for review
        if: success() && github.event_name == 'pull_request'
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 >/tmp/stn-shot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p artifacts
          CHROME="$(command -v google-chrome || command -v chromium)"
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --user-data-dir="$(mktemp -d)" --window-size=1440,1080 --virtual-time-budget=6000 \
            --screenshot=artifacts/ui.png 'http://127.0.0.1:5173/?demo=1' >/dev/null 2>/tmp/stn-shot.log
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --user-data-dir="$(mktemp -d)" --window-size=430,900 --virtual-time-budget=6000 \
            --screenshot=artifacts/mobile.png 'http://127.0.0.1:5173/?demo=1' >/dev/null 2>/tmp/stn-mobile.log
      - name: Upload UI screenshot
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshot
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist/src dist/documents
          cp index.html styles.css dist/
          cp src/*.mjs dist/src/
          cp documents/*.txt dist/documents/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
